apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app

    spec:
      containers:
      - name: app

        image: yourdockerhub/k8s-configmap-secret-demo:latest

        ports:
        - containerPort: 5000

        envFrom:
        - configMapRef:
            name: app-config

        env:
        - name: APP_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: APP_TOKEN

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"

          limits:
            cpu: "200m"
            memory: "128Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
